<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Cancio Club</title>
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght,wdth@100..900,62.5..125&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon-32.png?v=14" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon-180.png?v=14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cancio" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html,body{margin:0;background:#000000 linear-gradient(180deg, #0a0a0d 0%, #000000 12%, #000000 88%, #08080b 100%) fixed;background-attachment:fixed;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  /* grão sutil sobre o preto chapado — textura de material, não decoração; por isso opacidade baixa e pointer-events:none */
  body::before{content:"";position:fixed;inset:0;z-index:2147483647;pointer-events:none;opacity:0.03;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMycgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4K");background-repeat:repeat}
  @keyframes cc-boot-glow{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.75;transform:scale(1.06)}}
  @keyframes cc-boot-spin{to{transform:rotate(360deg)}}
  .cc-boot-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid transparent;border-top-color:#EEF3FB;animation:cc-boot-spin 1.1s linear infinite}
  .cc-boot-glow{position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,#C6D2E433,transparent 70%);animation:cc-boot-glow 1.8s ease-in-out infinite}
  /* shimmer do SkeletonCard — precisa estar no <style> estático (não no injetado pelo React) porque
     a tela de boot (ainda !ready) usa SkeletonCard antes do app montar o resto do CSS */
  @keyframes cc-shimmer{to{transform:translateX(100%)}}
  .cc-shimmer{position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.06) 50%, transparent 70%);animation:cc-shimmer 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.cc-shimmer{animation:none}}
  .cc-pill:active{transform:scale(.92)}
  .cc-tap:active{transform:scale(.96)}
  @media (prefers-reduced-motion: reduce){.cc-pill:active,.cc-tap:active{transform:none}}
  a{color:#C6D2E4}
  button,input,textarea{-webkit-appearance:none;appearance:none}
  .cc-full-h{min-height:100vh;min-height:100dvh}
</style>
</head>
<body>
<div id="root">
  <div class="cc-full-h" style="display:flex;align-items:center;justify-content:center;background:#000000;">
    <div style="position:relative;width:96px;height:96px;">
      <div class="cc-boot-glow"></div>
      <div class="cc-boot-ring"></div>
      <img src="/icon-512.png?v=14" alt="" width="96" height="96" style="width:96px;height:96px;display:block;position:relative;border-radius:50%;" />
    </div>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
