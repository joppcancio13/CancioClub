    function drawMiniChart(ctx, hist, x0, y0, w, h, color) {
        const vals = hist.map((p) => p.load);
        const vmin = Math.min(...vals), vmax = Math.max(...vals);
        const pad = Math.max(1.5, (vmax - vmin) * 0.2) || 3;
        const lo = vmin - pad, hi = vmax + pad;
        const n = hist.length;
        const toXY = (i, v) => [x0 + (n === 1 ? w / 2 : (i / (n - 1)) * w), y0 + h - ((v - lo) / (hi - lo)) * h];
        ctx.strokeStyle = "rgba(255,255,255,0.12)";
        ctx.lineWidth = 2;
        for (let g = 0; g <= 3; g++) {
            const gy = y0 + (h / 3) * g;
            ctx.beginPath();
            ctx.moveTo(x0, gy);
            ctx.lineTo(x0 + w, gy);
            ctx.stroke();
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 7;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        hist.forEach((p, i) => { const [x, y] = toXY(i, p.load); if (i === 0)
            ctx.moveTo(x, y);
        else
            ctx.lineTo(x, y); });
        ctx.stroke();
        hist.forEach((p, i) => {
            const [x, y] = toXY(i, p.load);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = color;
            ctx.fillRect(-9, -9, 18, 18);
            ctx.strokeStyle = C.ink;
            ctx.lineWidth = 3;
            ctx.strokeRect(-9, -9, 18, 18);
            ctx.restore();

        ctx.fillStyle = C.muted;
        ctx.font = "500 26px 'Inter', sans-serif";
        ctx.fillText(fmtDate(hist[0].date), x0, y0 + h + 44);
        ctx.textAlign = "right";
        ctx.fillText(fmtDate(hist[n - 1].date), x0 + w, y0 + h + 44);
    }
